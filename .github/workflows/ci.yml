name: CI

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Build
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pleromic-linux
          path: target/release/pleromic-pipeline

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Build
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pleromic-windows
          path: target\release\pleromic-pipeline.exe

  package-linux-appimage:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2
      - name: Build
        run: cargo build --release
      - name: Prepare AppDir
        run: |
          ./scripts/build_appimage.sh
      - name: Download appimagetool
        run: |
          curl -L -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
      - name: Create AppImage
        run: |
          ./appimagetool.AppImage dist/AppDir || true
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: pleromic-appimage
          path: pleromic-pipeline*.AppImage

  package-windows-zip:
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
      - name: Build (Windows)
        run: cargo build --release
      - name: Prepare ZIP
        run: |
          mkdir -p release_zip
          copy target\release\pleromic-pipeline.exe release_zip\
          xcopy /E /I assets release_zip\assets\
          powershell -Command "Compress-Archive -Path release_zip\* -DestinationPath pleromic-windows.zip"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pleromic-windows-zip
          path: pleromic-windows.zip
