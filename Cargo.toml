[package]
name = "pleromic-pipeline"
version = "0.1.0"
edition = "2021"
authors = ["Generated by Copilot"]
description = "Reference implementation of the Pleromic Pipeline: materialize 3D scenes into comic pages."
license = "MIT"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"
log = "0.4"
env_logger = "0.10"

# Optional GPU feature using wgpu (platform-dependent)
wgpu = { version = "0.16", optional = true }
bytemuck = { version = "1.12", optional = true }

[features]
default = []
gpu = ["wgpu", "bytemuck"]
